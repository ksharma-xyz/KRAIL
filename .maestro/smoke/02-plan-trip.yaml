# The core journey: pick an origin, pick a destination, get a timetable.
#
# Every selector is a testTag, and results are chosen by index rather than by
# name, so the flow does not break when NSW renames a stop or reorders results.
# The stop names typed in are inputs, not assertions.
#
# The waits here are sized for a software-rendered CI emulator, not for a
# developer machine. That emulator reports pinned CPU for the whole run, and this
# is the only flow in either lane long enough to be affected: it was the only one
# failing while the other five passed, and it failed at a DIFFERENT step on each
# attempt of the same run, once on the search screen appearing and once on the
# journey list. Two different steps timing out in one run is the signature of a
# budget that is too tight, not of a broken screen.
#
# The journey wait is the longest because it is the only one that includes a live
# NSW API round trip on top of the render.
appId: ${APP_ID}
---
- launchApp:
    clearState: false
    stopApp: true


# Unconditional. The shared flow settles the app and no-ops on a device that has
# already been through the carousel; guarding it here raced the first frame.
- runFlow: ../shared/dismiss-intro.yaml

- extendedWaitUntil:
    visible:
      id: "savedtrips.screen"
    timeout: 60000

# --- Origin ---
- tapOn:
    id: "searchrow.from"

- extendedWaitUntil:
    visible:
      id: "searchstop.query"
    timeout: 30000

- tapOn:
    id: "searchstop.query"
- inputText: "Central"

# Search is a network call, so give it real time rather than a fixed sleep.
- extendedWaitUntil:
    visible:
      id: "searchstop.result..*"
    timeout: 30000

- tapOn:
    id: "searchstop.result..*"
    index: 0

- extendedWaitUntil:
    visible:
      id: "searchrow.root"
    timeout: 30000

# --- Destination ---
- tapOn:
    id: "searchrow.to"

- extendedWaitUntil:
    visible:
      id: "searchstop.query"
    timeout: 30000

- tapOn:
    id: "searchstop.query"
- inputText: "Town Hall"

- extendedWaitUntil:
    visible:
      id: "searchstop.result..*"
    timeout: 30000

- tapOn:
    id: "searchstop.result..*"
    index: 0

- extendedWaitUntil:
    visible:
      id: "searchrow.root"
    timeout: 30000

# --- Timetable ---
- tapOn:
    id: "searchrow.search"

- extendedWaitUntil:
    visible:
      id: "timetable.screen"
    timeout: 30000

# Controls on the timetable that other flows and riders depend on. Asserted
# before the scroll below, while the top of the list is still on screen.
- assertVisible:
    id: "timetable.action.datetime"
- assertVisible:
    id: "timetable.action.reverse"

# The screen scaffold renders while the request is still in flight, so the
# journey cards are checked separately. This is what actually proves a trip was
# planned.
#
# Scrolled to rather than asserted in place: a "Save this trip?" prompt sits
# above the results, and on a short viewport it pushes every card below the
# fold. Maestro only matches what is on screen, so asserting in place would make
# this flow's result depend on device height.
- scrollUntilVisible:
    element:
      id: "timetable.journey..*"
    direction: DOWN
    timeout: 90000
