# The core journey: pick a destination, pick an origin, tap the go circle, get a timetable. Valid on today's
# home and on the map home (the maps flag on): both open Search Stop from `searchrow.to`, and the To and From
# form there stays on screen through both picks, so the trip leaves only with the go circle.
#
# Every selector is a testTag, and results are chosen by index rather than by
# name, so the flow does not break when NSW renames a stop or reorders results.
# The stop names typed in are inputs, not assertions.
#
# The waits here are sized for a software-rendered CI emulator, not for a
# developer machine. That emulator reports pinned CPU for the whole run, and this
# is the only flow in either lane long enough to be affected: it was the only one
# failing while the other five passed, and it failed at a DIFFERENT step on each
# attempt of the same run, once on the search screen appearing and once on the
# journey list. Two different steps timing out in one run is the signature of a
# budget that is too tight, not of a broken screen.
#
# The journey wait is the longest because it is the only one that includes a live
# NSW API round trip on top of the render.
appId: ${APP_ID}
---
- launchApp:
    clearState: false
    stopApp: true


# Unconditional. The shared flow settles the app and no-ops on a device that has
# already been through the carousel; guarding it here raced the first frame.
- runFlow: ../shared/dismiss-intro.yaml

- extendedWaitUntil:
    visible:
      id: "savedtrips.screen"
    timeout: 60000

# --- Destination ---
# The destination comes first because `searchrow.to` is the one entry that exists in both homes: it is the To
# bar on today's home and the only bar on the map home, the pill. Both open Search Stop. The trip is the same
# either way: Central to Town Hall.
- tapOn:
    id: "searchrow.to"

# Stop search opens on the MAP state: the map, the bars and the recents card, with no keyboard
# (rules 9 and 39 of docs/MAP_HOME_UX.md). Tapping the bar raises the list state, where the card
# grows into the list, so `searchstop.recents` is asserted after that tap, the same as before.
#
# `searchstop.recents` is the Recent-mode list itself, so it is present on a fresh device
# with no recents at all.
#
# There is no map options sheet to dismiss on the way in any more: it was deleted with the
# map options. The shared dismiss-map-options.yaml has no callers.
- extendedWaitUntil:
    visible:
      id: "searchstop.query"
    timeout: 30000

- tapOn:
    id: "searchstop.query"

- extendedWaitUntil:
    visible:
      id: "searchstop.recents"
    timeout: 30000
- inputText: "Town Hall"

# Search is a network call, so give it real time rather than a fixed sleep.
- extendedWaitUntil:
    visible:
      id: "searchstop.result..*"
    timeout: 30000

- tapOn:
    id: "searchstop.result..*"
    index: 0

# A pick never leaves Search Stop: the destination fills its bar and the screen stays. The From bar is
# on screen with it, filled with the nearest stop when the device has a fix and empty when it has none.
- extendedWaitUntil:
    visible:
      id: "searchrow.from"
    timeout: 30000

# --- Origin ---
# Tapped whether or not it filled itself, so the flow is the same on a device with a fix and one without,
# and an origin that did fill itself is replaced by the one chosen here, which is what makes it editable.
- tapOn:
    id: "searchrow.from"

# Same steps for the origin: the bar being edited moved to From, so the query field is there again.
- extendedWaitUntil:
    visible:
      id: "searchstop.query"
    timeout: 30000

- tapOn:
    id: "searchstop.query"

- extendedWaitUntil:
    visible:
      id: "searchstop.recents"
    timeout: 30000
- inputText: "Central"

- extendedWaitUntil:
    visible:
      id: "searchstop.result..*"
    timeout: 30000

- tapOn:
    id: "searchstop.result..*"
    index: 0

# --- Timetable ---
# Both bars hold a stop now, so the go circle shows. It is the only way out of Search Stop with a trip.
- extendedWaitUntil:
    visible:
      id: "searchrow.search"
    timeout: 30000
- tapOn:
    id: "searchrow.search"

- extendedWaitUntil:
    visible:
      id: "timetable.screen"
    timeout: 30000

# Controls on the timetable that other flows and riders depend on. Asserted
# before the scroll below, while the top of the list is still on screen.
- assertVisible:
    id: "timetable.action.datetime"
- assertVisible:
    id: "timetable.action.reverse"

# The screen scaffold renders while the request is still in flight, so the
# journey cards are checked separately. This is what actually proves a trip was
# planned.
#
# Scrolled to rather than asserted in place: a "Save this trip?" prompt sits
# above the results, and on a short viewport it pushes every card below the
# fold. Maestro only matches what is on screen, so asserting in place would make
# this flow's result depend on device height.
- scrollUntilVisible:
    element:
      id: "timetable.journey..*"
    direction: DOWN
    timeout: 90000
