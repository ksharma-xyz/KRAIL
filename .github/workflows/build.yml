name: Krail App CI

on:
  push:
    branches: [ main ]          # prod/* is handled by release-2-deploy-rc.yml
  pull_request:
    branches: [ main, prod/* ] # PRs to prod branches still get a quality+build check
    types: [ opened, synchronize, reopened, ready_for_review ]

permissions:
  actions: write  # allows build-android.yml to write back ANDROID_VERSION_CODE

concurrency:
  # Fall back to the ref on push: pull_request.number is empty there, so every main push
  # otherwise shared one group and each merge cancelled the previous push's run. Cancelling is
  # right for a PR (a new commit supersedes the old one) and wrong for main, where every commit
  # needs its own result and its Codecov upload.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The Dependabot gate lives inside build-android.yml and build-ios.yml, not here. The
# branch ruleset for `main` requires the contexts "build-android-debug / build",
# "build-android-release / build" and "build-ios / build", which are named after the
# inner job of the reusable workflow. Skipping a caller job below emits a check run
# named only "build-android-debug", so the required context never reports and the pull
# request stays blocked. Skipping the inner job still emits the fully qualified name
# with a skipped conclusion, which does satisfy the requirement.
jobs:
  code-quality:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    uses: ./.github/workflows/code-quality.yml
    # Deliberately passes no secrets. Everything code-quality.yml needs — including
    # CODECOV_TOKEN — comes from the `Firebase` environment its job declares. See the
    # Codecov step there.

  # Runs in parallel with code-quality rather than after it: it is the one job on a macOS
  # runner and the slowest of the two, so gating it on detekt would add its wait to the
  # critical path for no benefit. Nothing depends on it either — a pixel diff should not
  # stop the APK from building, so the builds below still only need code-quality. This
  # check is not in the `main` branch ruleset yet; add "verify-snapshots" there once the
  # goldens have proven stable across a few runs.
  snapshot-verify:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    uses: ./.github/workflows/snapshot-verify.yml
    secrets: inherit

  build-android-debug:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    needs: code-quality
    uses: ./.github/workflows/build-android.yml
    with:
      variant: debug
    secrets: inherit

  build-android-release:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    needs: code-quality
    uses: ./.github/workflows/build-android.yml
    with:
      variant: release
    secrets: inherit

  build-ios:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    needs: code-quality
    uses: ./.github/workflows/build-ios.yml
    secrets: inherit

  distribute-debug-apk-firebase:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-android-debug
    uses: ./.github/workflows/distribute-firebase.yml
    with:
      variant: debug
    secrets: inherit

  distribute-release-apk-firebase:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-android-release
    uses: ./.github/workflows/distribute-firebase.yml
    with:
      variant: release
    secrets: inherit
