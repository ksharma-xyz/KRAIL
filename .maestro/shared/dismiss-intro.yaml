# Gets past the first-run Intro, and is safe to call on a device that has
# already been through it.
#
# Callers invoke this unconditionally, immediately after `launchApp`. It used to
# be guarded by the caller on `intro.screen` being visible, which is what broke
# the lane on CI: `launchApp` returns once the process is in the foreground, not
# once Compose has drawn, so on a freshly booted emulator the guard was evaluated
# against a hierarchy that had nothing in it yet. It skipped, the carousel stayed
# up, and the caller's next wait counted down against a screen that was never
# going to arrive. Every flow failed on its first assertion for that reason and
# no other. Settling here, inside the one file that knows about the Intro, is
# what makes the check meaningful, and it keeps the six callers identical.
#
# The Intro is five screens with one question each: the theme colour, Park & Ride,
# where to, where from, and save this trip. Every screen asks yes or no with the same
# two buttons, and the right one is `intro.action.primary`, the positive answer.
# Looping on that tag walks the whole thing without this flow knowing how many
# screens there are or what any of them say. Saying yes everywhere means a cold run
# adds the Park & Ride station when the phone is near one, and saves a trip only when
# a pair was picked, which a cold run never does, so the last screens end the Intro
# with nothing saved.
#
# The first screen is the one exception. Its primary button, "Yes, this one", is
# disabled until a theme badge has been tapped, because the rider has to choose a
# colour before going on. So each pass first taps the Train badge, `intro.theme.train`,
# but only while that badge is on screen. On every other screen it is not there and
# nothing is tapped.
#
# The badges on the first screen drift and the chosen one dances for as long as the
# screen is up, so that screen never stops moving. The waits for the animation to end
# run to their timeouts there and then carry on. That costs a few seconds and is not
# a failure.
#
# On a cold install the stops are still loading when the last screens open. Their
# primary button is then disabled for a few seconds, and a tap on a disabled button
# does nothing, so each pass waits for the button to be enabled before it taps. The
# Park & Ride screen does the same while its station is looked for. Without that wait
# the taps are spent on a disabled button and the cap below runs out before the app
# is ready.
#
# `times` is a safety net, not the exit condition: `while` is what ends the
# loop. Without the cap a button that stops responding would hang the run
# instead of failing it.
#
# Not a test. It has no assertions, and a directory run does not pick it up
# because `.maestro/shared/` sits outside both `smoke/` and `nightly/`.
appId: ${APP_ID}
---
# Wait for the app to stop drawing before looking at anything. Cheap on a warm
# device, and on a cold one it is the difference between seeing the Intro and
# seeing an empty window.
- waitForAnimationToEnd:
    timeout: 30000

# `optional`, because a device that has already been through the Intro never
# shows this button. There it warns, costs the timeout below, and the repeat that
# follows then does nothing. On a clean device it is what absorbs the rest of a
# slow cold start.
- extendedWaitUntil:
    visible:
      id: "intro.action.primary"
    timeout: 15000
    optional: true

- repeat:
    times: 12
    while:
      visible:
        id: "intro.action.primary"
    commands:
      # Only the theme screen has this badge. Choosing a colour is what turns its
      # primary button on.
      - runFlow:
          when:
            visible:
              id: "intro.theme.train"
          commands:
            - tapOn:
                id: "intro.theme.train"
      # Optional, so a device that never reports the state costs the timeout
      # once for each pass and then taps as before.
      - extendedWaitUntil:
          visible:
            id: "intro.action.primary"
            enabled: true
          timeout: 30000
          optional: true
      - tapOn:
          id: "intro.action.primary"
      # The screen slides into the next. Tapping through that lands the
      # second tap on the screen that is still moving in.
      - waitForAnimationToEnd:
          timeout: 5000
