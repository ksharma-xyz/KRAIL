# Cold launch. Pins that the app starts, the home screen composes, and the two
# controls every other flow depends on are present.
#
# Deliberately asserts the saved-trips *list container*, never its contents: a
# fresh install has no saved trips, and a flow that needs seeded data is not a
# smoke test.
appId: ${APP_ID}
---
- launchApp:
    clearState: false
    stopApp: true


# Unconditional. The shared flow settles the app and no-ops on a device that has
# already been through the carousel; guarding it here raced the first frame.
- runFlow: ../shared/dismiss-intro.yaml

- extendedWaitUntil:
    visible:
      id: "savedtrips.screen"
    timeout: 60000


# The search capsule alone at the bottom is the app's primary action. If it is
# missing, the home screen rendered but is useless.
#
# The capsule slides in once the saved trips have loaded, so it is waited for
# rather than asserted. Asserting it in place passes on a warm device and fails on
# a cold one, which is the worst kind of flake: green locally, red in CI, and only
# on the first run. The home has this one capsule in every posture, with no sheet
# and no pills in it, and no From bar or go circle, which belong to Search Stop.
# `searchrow.root` is the capsule and `searchrow.to` is the tappable pill inside it.
- extendedWaitUntil:
    visible:
      id: "searchrow.root"
    timeout: 20000
- extendedWaitUntil:
    visible:
      id: "searchrow.to"
    timeout: 20000

# The list, and the label row that is its first item, above the Saved Trips heading.
# The row draws with the first list, once the labels have loaded, and a fresh install
# always has Home, so it is there.
- assertVisible:
    id: "savedtrips.list"
- extendedWaitUntil:
    visible:
      id: "savedtrips.pills"
    timeout: 20000

# The location notice is on Search Stop only, never on a phone home.
- assertNotVisible:
    id: "searchstop.locationpill"

# Settings is the only always-present title-bar action (Discover is flagged off
# by default), so it stands in for "the title bar rendered".
- assertVisible:
    id: "savedtrips.action.settings"
