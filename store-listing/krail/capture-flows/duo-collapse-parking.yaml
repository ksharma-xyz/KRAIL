# iPhone Duo outer: collapse the expanded Tallawong card and scroll back to the
# top of Saved Trips.
appId: xyz.ksharma.krail
---
- tapOn: "Tallawong P1"
- waitForAnimationToEnd
- swipe:
    start: "40%,25%"
    end: "40%,65%"
    duration: 500
- waitForAnimationToEnd
- assertVisible: "Tallawong Station"
- assertVisible: "Saved Trips"
