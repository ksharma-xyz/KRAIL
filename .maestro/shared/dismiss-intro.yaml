# Gets past the first-run Intro, and is safe to call on a device that has
# already been through it.
#
# Callers invoke this unconditionally, immediately after `launchApp`. It used to
# be guarded by the caller on `intro.screen` being visible, which is what broke
# the lane on CI: `launchApp` returns once the process is in the foreground, not
# once Compose has drawn, so on a freshly booted emulator the guard was evaluated
# against a hierarchy that had nothing in it yet. It skipped, the Intro stayed
# up, and the caller's next wait counted down against a screen that was never
# going to arrive. Every flow failed on its first assertion for that reason and
# no other. Settling here, inside the one file that knows about the Intro, is
# what makes the check meaningful, and it keeps the six callers identical.
#
# The Intro is five screens with one question each: the theme colour, Park & Ride,
# where you go, where you start, and save this trip. The right button is
# `intro.action.primary`, the positive answer, and the left one is
# `intro.action.secondary`. Saying yes everywhere means a cold run adds the Park & Ride
# station when the phone is near one. The loop runs for as long as the Intro is on
# screen, `intro.screen`, and each pass answers the screen it finds, so this flow does not
# need to know how many screens there are.
#
# Three screens do not show their button until the rider has picked something: the theme
# screen until a badge is tapped, and the destination and origin screens until a stop is
# tapped. On those the button is not on screen at all, so a pass first picks, the Train
# badge, `intro.theme.train`, or the first listed stop, `intro.stop.first`, and then taps
# the primary button. On the destination and origin screens that selects a stop and
# confirms it, so a cold run ends on the last screen with two stops chosen. That screen is
# the one place the loop answers with the left button, Not now, found by its trip tile
# `intro.confirm.tile`, so the Intro ends with nothing saved and a cold run starts the
# app with no saved trip, as it always has. Typing in the search field is never needed.
#
# The badges on the first screen drift and the chosen one dances for as long as the
# screen is up, so that screen never stops moving, and a wait for the animation to end
# there only ever runs to its timeout. So the first wait below is for the first screen
# itself, its Train badge, which ends the moment it is drawn, and the one wait after a
# tap is short and its timeout is never what the run depends on.
#
# On a cold install the stops are still loading when the last screens open. The primary
# button is then disabled for a few seconds, and a tap on a disabled button does
# nothing, so each pass waits for the button to be enabled before it taps. The Park &
# Ride screen does the same while its station is looked for. Without that wait the taps
# are spent on a disabled button and the cap below runs out before the app is ready.
#
# After Not now, the Intro hands over to the finale: the wordmark, the theme colour flooding the
# screen, Saved Trips opening underneath it, and the colour fading out. It takes about 3.5 s, and
# while it is up the app behind it is hidden from the accessibility tree, so none of the Intro's
# tags are visible, the loop above ends, and `savedtrips.screen` is not there until the colour
# has lifted. So the last step waits for Saved Trips, with room for a slow device, instead of
# racing the overlay. A tap on the screen would skip the finale, but this flow never taps it,
# because the wait is the one thing that is certain to work on both platforms.
#
# `times` is a safety net, not the exit condition: `while` is what ends the
# loop. Without the cap a button that stops responding would hang the run
# instead of failing it.
#
# Not a test. It has no assertions, and a directory run does not pick it up
# because `.maestro/shared/` sits outside both `smoke/` and `nightly/`.
appId: ${APP_ID}
---
# Wait for the first screen to be drawn, which is the Train badge on the theme screen.
# Cheap on a warm device, and on a cold one it is the difference between seeing the
# Intro and seeing an empty window. `optional`, because a device that has already been
# through the Intro never shows it: there it warns, costs the timeout once, and the
# repeat that follows then does nothing. The wait ends as soon as the badge is on screen,
# unlike a wait for the animation to end, which the badges keep running for the full
# timeout.
- extendedWaitUntil:
    visible:
      id: "intro.theme.train"
    timeout: 30000
    optional: true

- repeat:
    times: 12
    while:
      visible:
        id: "intro.screen"
    commands:
      # Park & Ride, or any screen that already shows its button: the positive answer. It is first in the
      # pass, before anything is picked, so the theme and stop screens, which show no button until a pick,
      # are not answered here, and the last screen, which has the trip tile, is left to the block below.
      - runFlow:
          when:
            notVisible:
              id: "intro.confirm.tile"
            visible:
              id: "intro.action.primary"
          commands:
            # Optional, so a device that never reports the state costs the timeout
            # once for each pass and then taps as before.
            - extendedWaitUntil:
                visible:
                  id: "intro.action.primary"
                  enabled: true
                timeout: 30000
                optional: true
            - tapOn:
                id: "intro.action.primary"
            # The screen slides into the next. Tapping through that lands the
            # second tap on the screen that is still moving in.
            - waitForAnimationToEnd:
                timeout: 5000
      # The last screen: Not now, so nothing is saved. Its trip tile is what says it is
      # the last screen. Once this is tapped the Intro leaves, so the rest of the pass
      # does not run for it.
      - runFlow:
          when:
            visible:
              id: "intro.confirm.tile"
          commands:
            - tapOn:
                id: "intro.action.secondary"
            - waitForAnimationToEnd:
                timeout: 5000
      # The theme screen: pick the Train badge, which brings the button in, then the positive answer.
      - runFlow:
          when:
            visible:
              id: "intro.theme.train"
          commands:
            - tapOn:
                id: "intro.theme.train"
            - extendedWaitUntil:
                visible:
                  id: "intro.action.primary"
                timeout: 30000
                optional: true
            - tapOn:
                id: "intro.action.primary"
            - waitForAnimationToEnd:
                timeout: 5000
      # The destination and origin screens: select the first listed stop, which brings the button
      # in, then the positive answer.
      - runFlow:
          when:
            visible:
              id: "intro.stop.first"
          commands:
            - tapOn:
                id: "intro.stop.first"
            - extendedWaitUntil:
                visible:
                  id: "intro.action.primary"
                timeout: 30000
                optional: true
            - tapOn:
                id: "intro.action.primary"
            - waitForAnimationToEnd:
                timeout: 5000

# The finale has to end before Saved Trips can be used. `optional`, like the first wait, because
# a device that has already been through the Intro is on Saved Trips at once, and because the
# callers each wait for the screen themselves and are what fails the run if it never comes.
- extendedWaitUntil:
    visible:
      id: "savedtrips.screen"
    timeout: 15000
    optional: true
