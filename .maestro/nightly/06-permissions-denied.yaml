# Location denied is a supported state, not an error state. The app uses GPS to
# offer a nearby origin; without it every other path must still work.
#
# `clearState: true` would be the obvious way to guarantee a clean permission
# state, and it is wrong here: it also wipes the "intro seen" flag, so the flow
# would spend its time walking the first-run carousel instead of testing a
# denial. Maestro's `permissions:` map revokes without touching app data, which
# is what this needs.
#
# On a device where location was previously granted, revoke it out of band
# before the run so the denial is real rather than assumed:
#
#   adb shell pm revoke xyz.ksharma.krail.debug android.permission.ACCESS_FINE_LOCATION
#   adb shell pm revoke xyz.ksharma.krail.debug android.permission.ACCESS_COARSE_LOCATION
appId: ${APP_ID}
---
- launchApp:
    clearState: false
    stopApp: true
    permissions:
      # `never`, not `deny`. Both drivers accept `never`; only Android accepts
      # `deny`, and on iOS it does not fail the assertion, it throws out of
      # launchApp itself:
      #
      #   IllegalArgumentException: wrong argument value 'deny' was provided
      #   for 'location' permission
      #     at util.LocalSimulatorUtils.setLocationPermission
      #
      # That is why this flow died in under a second on the iOS leg of the
      # nightly while every assertion below it went unread. Verified against
      # both a simulator and an emulator.
      location: never

# Unconditional. The shared flow settles the app and no-ops on a device that has
# already been through the carousel; guarding it here raced the first frame.
- runFlow: ../shared/dismiss-intro.yaml

- extendedWaitUntil:
    visible:
      id: "savedtrips.screen"
    timeout: 60000

# Home renders and the primary action is reachable with no location fix.
- assertVisible:
    id: "searchrow.root"
- assertVisible:
    id: "searchrow.to"

# Planning a trip by typing must not depend on GPS at all. Home opens Search Stop, which holds the To and
# From form, and a pick never leaves it: the destination fills its bar and the screen stays.
- tapOn:
    id: "searchrow.to"
- extendedWaitUntil:
    visible:
      id: "searchstop.query"
    timeout: 20000

# Search Stop opens on its map state, and the denial is the Location is off notice under the box. It is drawn
# on the map state only: the list state a typed query raises draws no notice on a phone, so it is asserted here
# and not after the pick.
- extendedWaitUntil:
    visible:
      id: "searchstop.locationpill"
    timeout: 20000
- tapOn:
    id: "searchstop.query"
- inputText: "Central"
- extendedWaitUntil:
    visible:
      id: "searchstop.result..*"
    timeout: 30000
- tapOn:
    id: "searchstop.result..*"
    index: 0

# Still on Search Stop, in its list state, with the form on screen. If the denial had crashed a background
# coroutine this is where it surfaces.
- extendedWaitUntil:
    visible:
      id: "searchrow.from"
    timeout: 30000
- assertVisible:
    id: "searchrow.to"
- assertNotVisible:
    id: "savedtrips.screen"

# Back leaves for home, still alive. It goes one step at a time, the keyboard, then the list state to the map
# state, then the screen, so it is pressed for as long as Search Stop is on screen.
- repeat:
    times: 4
    while:
      visible:
        id: "searchstop.query"
    commands:
      - back
- extendedWaitUntil:
    visible:
      id: "savedtrips.screen"
    timeout: 20000
- assertVisible:
    id: "searchrow.root"
# The denial is shown on Search Stop only, and never as a notice on the phone home.
- assertNotVisible:
    id: "searchstop.locationpill"
