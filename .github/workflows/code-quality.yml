name: Code Quality

on:
  workflow_call:
    outputs:
      detekt-passed:
        description: "Whether Detekt checks passed"
        value: ${{ jobs.detekt.outputs.passed }}

jobs:
  detekt:
    runs-on: ubuntu-latest
    environment: Firebase
    # Hard cap so a hung test (e.g. an unbounded `advanceUntilIdle()` against a
    # `while (isActive)` polling loop) can't sit on a runner for 6h. Detekt is
    # ~3min, host tests ~10min on a cold cache, so 20min is generous head-room.
    timeout-minutes: 20
    outputs:
      passed: ${{ steps.detekt.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup environment variables
        run: |
          echo "ANDROID_NSW_TRANSPORT_API_KEY=${{ secrets.ANDROID_NSW_TRANSPORT_API_KEY }}" >> $GITHUB_ENV
          echo "IOS_NSW_TRANSPORT_API_KEY=${{ secrets.IOS_NSW_TRANSPORT_API_KEY }}" >> $GITHUB_ENV

      - name: set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 21

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      # Test-infrastructure guardrails — run BEFORE detekt/tests so a misconfigured
      # module (missing withHostTest{}, test code leaking into production, ad-hoc
      # duplicated fakes) fails fast with a clear message instead of silently
      # skipping its tests. These tasks are also wired into `check` for local runs.
      - name: Verify test wiring
        id: verify-test-wiring
        env:
          CI: true
          GITHUB_ACTIONS: true
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          ./gradlew
          verifyTestWiring verifyTestingModuleUsage verifyNoAdHocBoundaryFakes
          verifyIosTestClassification
          --continue -PciQuality=true

      # -PciQuality=true tells core/network/build.gradle.kts to skip the
      # API-key requirement and use placeholders instead — neither detekt nor
      # the host tests hit the network so real keys aren't needed.
      - name: Run Detekt
        id: detekt
        env:
          ANDROID_NSW_TRANSPORT_API_KEY: ${{ secrets.ANDROID_NSW_TRANSPORT_API_KEY }}
          IOS_NSW_TRANSPORT_API_KEY: ${{ secrets.IOS_NSW_TRANSPORT_API_KEY }}
          CI: true
          GITHUB_ACTIONS: true
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew detekt -PciQuality=true

      # Run all KMP host tests (Compose UI tests via Robolectric live in
      # androidUnitTest, so this also exercises them). --continue surfaces every
      # failing module in one CI run instead of stopping at the first.
      - name: Run host tests
        id: tests
        if: always() && steps.detekt.conclusion != 'cancelled'
        env:
          ANDROID_NSW_TRANSPORT_API_KEY: ${{ secrets.ANDROID_NSW_TRANSPORT_API_KEY }}
          IOS_NSW_TRANSPORT_API_KEY: ${{ secrets.IOS_NSW_TRANSPORT_API_KEY }}
          CI: true
          GITHUB_ACTIONS: true
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew testAndroidHostTest --continue -PciQuality=true

      # The custom detekt rules (`:detekt-rules`, e.g. PublicImplementationClass) live in the
      # `gradle/build-logic` included build, and its test suite ran nowhere: `./gradlew detekt`
      # only compiles the rules, and a root-build `test` invocation cannot reach across the
      # composite boundary. A rule could therefore stop flagging anything and CI would still
      # be green. `-p` runs the task inside the included build directly.
      - name: Run build-logic tests
        id: build-logic-tests
        if: always() && steps.detekt.conclusion != 'cancelled'
        env:
          CI: true
          GITHUB_ACTIONS: true
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew -p gradle/build-logic :detekt-rules:test

      # Kover's report tasks depend on the very testAndroidHostTest tasks the step above just
      # ran, so those are UP-TO-DATE here and this only does the merge — coverage costs a
      # report, not a second test run. Skipped when tests failed: partial coverage from a
      # broken run is worse than none.
      - name: Generate coverage report
        id: coverage
        if: steps.tests.outcome == 'success'
        env:
          ANDROID_NSW_TRANSPORT_API_KEY: ${{ secrets.ANDROID_NSW_TRANSPORT_API_KEY }}
          IOS_NSW_TRANSPORT_API_KEY: ${{ secrets.IOS_NSW_TRANSPORT_API_KEY }}
          CI: true
          GITHUB_ACTIONS: true
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :koverXmlReport :koverHtmlReport -PciQuality=true

      - name: Upload coverage report (HTML)
        if: always() && steps.coverage.conclusion == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report-${{ github.run_id }}
          path: build/reports/kover/html/**
          if-no-files-found: warn
          retention-days: 7

      # CODECOV_TOKEN must live in the `Firebase` environment, alongside the API keys above.
      # A reusable workflow cannot see repository secrets, and the alternatives are both
      # worse: `secrets: inherit` would hand this workflow the signing keystores and store
      # credentials to deliver one upload token, and declaring `workflow_call.secrets` closes
      # the secrets context, so the environment-only API keys above stop resolving.
      # Upload is best-effort — a missing token or a Codecov outage must not fail a PR.
      - name: Upload coverage to Codecov
        if: always() && steps.coverage.conclusion == 'success'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: build/reports/kover/report.xml
          flags: host-tests
          fail_ci_if_error: false

      - name: Upload Detekt reports
        if: always() && steps.detekt.conclusion != 'skipped'
        uses: actions/upload-artifact@v7
        with:
          name: detekt-reports-${{ github.run_id }}
          path: |
            **/build/reports/detekt/detekt.html
            **/build/reports/detekt/detekt.xml
            **/build/reports/detekt/detekt.md
            **/build/reports/detekt/detekt.txt
            build/reports/problems/problems-report.html
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload test reports
        if: always() && steps.tests.conclusion != 'skipped'
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ github.run_id }}
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
            gradle/build-logic/detekt-rules/build/reports/tests/**
            gradle/build-logic/detekt-rules/build/test-results/**
          if-no-files-found: ignore
          retention-days: 7
